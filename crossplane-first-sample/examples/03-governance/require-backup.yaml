#    spec:
#      parameters:
#        size: medium
#        engine: postgres
#        version: "15"
#        backup: false  # This will be rejected!
#        tags:
#          cost-center: engineering
#          project: test
#          environment: production
#      compositionSelector:
#        matchLabels:
#          provider: aws
#    EOF
#
# 3. This should be ACCEPTED (production with backup):
#    # Change backup: false to backup: true
#
# 4. Development databases don't need backups (ACCEPTED):
