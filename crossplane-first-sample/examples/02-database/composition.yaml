# examples/02-database/composition.yaml
# AWS RDS Composition - Simple and reliable version for learning

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xdatabase.aws.platform.example.com
  labels:
    provider: aws
    service: rds
spec:
  writeConnectionSecretsToNamespace: crossplane-system
  compositeTypeRef:
    apiVersion: platform.example.com/v1alpha1
    kind: XDatabase
  
  resources:
  - name: rds-instance
    base:
      apiVersion: rds.aws.upbound.io/v1beta1
      kind: Instance
      spec:
        forProvider:
          region: eu-west-1
          # Database configuration
          engine: postgres
          engineVersion: "15"
          instanceClass: db.t3.micro
          allocatedStorage: 20
          # Security settings
          storageEncrypted: true
          storageType: gp3
          publiclyAccessible: false
          skipFinalSnapshot: true  # For learning - set to false in production
          # Backup and availability (Free Tier compatible)
          backupRetentionPeriod: 1  # Free Tier max = 1 day
          multiAz: false
          # Credentials (using pre-created secret for password)
          username: dbadmin
          passwordSecretRef:
            key: password
            name: rds-database-password
            namespace: crossplane-system
    
    patches:
    # Patch engine from claim
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.engine
      toFieldPath: spec.forProvider.engine
    
    # Patch tags for cost allocation
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.tags
      toFieldPath: spec.forProvider.tags
      policy:
        fromFieldPath: Optional
    
    # Export connection details to status
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.endpoint
      toFieldPath: status.endpoint
      policy:
        fromFieldPath: Optional
    
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.port
      toFieldPath: status.port
      policy:
        fromFieldPath: Optional
    
    # Connection secret details
    connectionDetails:
    - name: username
      fromFieldPath: spec.forProvider.username
    - name: password
      fromConnectionSecretKey: password
    - name: endpoint
      fromFieldPath: status.atProvider.endpoint
    - name: port
      fromFieldPath: status.atProvider.port
    - name: database
      value: postgres